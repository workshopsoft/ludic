name: commit-lint

# Enforce Conventional Commits in CI, as a backstop to the local commit-msg hook
# (which a contributor only gets after `git config core.hooksPath tools/git-hooks`).
# Lints every new commit's summary line against tools/git-hooks/lib.sh — the same
# rule the hook uses, so the two can never drift.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-24.04
    container: node:20-bookworm
    steps:
      - name: Check out with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history so both endpoints of the range are present
          fetch-depth: 0
          persist-credentials: false
          # a pull request's own head, not the merge commit GitHub builds for it
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory '*'
          # Pick the range of *new* commits to lint:
          #  - pull_request: base branch .. the pull request's head
          #  - push:         the pushed range (event.before .. this commit)
          #  - new branch / unknown: just the tip commit
          # `event.before` is only usable if it still resolves: a force-push
          # rewrites (and a gc can remove) the commit it names, which made this
          # job fail with "Invalid revision range" on an otherwise clean push.
          # Fall back to the tip commit in that case.
          if [ -n "${BASE:-}" ]; then
            RANGE="origin/${BASE}..${HEAD_SHA}"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${HEAD_SHA}"
          else
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          fi
          echo "linting range: $RANGE"
          sh tools/git-hooks/lint-range.sh "$RANGE"
