name: release

# Cutting a release is `ludic-dev release` + `git push --tags`; everything after that
# happens here. The tag is the trigger and CI is the only thing that publishes:
# the artifacts are built from the tagged tree, with checksums, and only after
# that tree has passed its tests.
#
# The job refuses to publish unless:
#   * the tag matches the VERSION file in the tagged tree,
#   * CHANGELOG.md has a section for that version (it becomes the release notes),
#   * the toolchain builds from the IR seed,
#   * the ci workflow passed on the tagged commit - or on its parent, when the tag's
#     commit is `ludic-dev release`'s own (VERSION, CHANGELOG.md and changes/ only):
#     the suites are not run a second time here,
#   * the C-free bootstrap still reproduces the seed byte-for-byte.
#
# The release is created with the workflow's own GITHUB_TOKEN, so no secret is
# needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.4.0)'
        required: true

permissions:
  contents: write
  actions: read     # the ci runs of the tagged commit

jobs:
  publish:
    runs-on: ubuntu-24.04
    container: node:20-bookworm
    steps:
      - name: Install clang-16 and gh
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang-16 git ca-certificates curl gh
          clang-16 --version | head -1
          gh --version | head -1

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A full clone: `git archive` needs the tag object, and the tarball is
          # built from the tag rather than from the working tree.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Point the build at the Linux stdio shim
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          git config --global --add safe.directory '*'
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # See ci.yml for why the Linux build injects the stdio shim via LUDIC_CC.
          echo "LUDIC_CC=clang-16 $(pwd)/tools/ci/linux_stdio_shim.ll -lm" >> "$GITHUB_ENV"
          echo "LUDIC_HOME=$(pwd)" >> "$GITHUB_ENV"

      - name: The tag, VERSION and CHANGELOG must agree
        run: |
          set -eu
          VERSION="$(cat VERSION)"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match VERSION (${VERSION})"
            exit 1
          fi
          if ! grep -q "^## v${VERSION} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section to use as release notes"
            exit 1
          fi
          echo "publishing ${TAG}"

      - name: Build the toolchain from the IR seed (clang only)
        run: |
          set -eu
          mkdir -p bin
          clang-16 tools/ci/linux_stdio_shim.ll selfhost/ludicc.seed.ll -o bin/ludicc
          bin/ludicc --unsafe --globals tools/ludic-cli/dev.ludic -o bin/ludic-dev
          bin/ludic-dev build

      - name: The tagged tree passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          SHA="$(git rev-parse "${TAG}^{commit}")"
          passed() {
            n="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=$1&status=success" --jq '.total_count')"
            [ "${n:-0}" -gt 0 ]
          }
          if passed "$SHA"; then echo "ci passed on ${SHA}"; exit 0; fi
          # the release commit itself: ci on it may still be running, and what it changes
          # (the version, the changelog, the changesets it consumed) is not what the suites test
          PARENT="$(git rev-parse "${SHA}^")"
          OTHER="$(git diff --name-only "$PARENT" "$SHA" | grep -vE '^(VERSION|CHANGELOG\.md|changes/.*)$' || true)"
          if [ -z "$OTHER" ] && passed "$PARENT"; then
            echo "ci passed on ${PARENT}; ${TAG}'s commit changes only VERSION, CHANGELOG.md and changes/"
            exit 0
          fi
          echo "::error::no successful ci run for ${SHA}${OTHER:+ (it changes more than the release files: ${OTHER})}; wait for it, or re-run this workflow once it passes"
          exit 1

      - name: The C-free bootstrap still reproduces the seed
        run: bin/ludic-dev bootstrap-cfree

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUDIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          set -eu
          # ludic-dev publish builds dist/ (source tarball from the tag, this host's
          # toolchain, SHA256SUMS), takes the notes from the CHANGELOG section,
          # and creates the release. Re-running it only adds missing assets, so
          # a maintainer can afterwards attach the macOS toolchain from a Mac
          # with the same command.
          bin/ludic-dev publish "$TAG"
