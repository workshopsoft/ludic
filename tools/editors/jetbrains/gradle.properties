pluginGroup = io.ludic.ide
pluginName = Ludic
pluginVersion = 1.5.0

# 2024.2 (242) is the oldest platform LSP4IJ 0.20+ installs on, so it is the
# floor here too: claiming older would let an IDE accept this plugin and then
# fail to find its required dependency. LSP4IJ (not the paid-IDE LSP API)
# supplies the language-server bridge, so the free IDEs are supported as well.
pluginSinceBuild = 242
# Deliberately ahead of the newest released platform (2025.3 is build 253): an
# until-build that stops at today's IDE gets the plugin auto-disabled the moment
# a user upgrades. 262 buys roughly three release cycles of headroom. The APIs
# this plugin uses are the stable ones (LexerBase, SyntaxHighlighter,
# ParserDefinition, FoldingBuilder), and everything project-wide is delegated to
# ludic-lsp over a versioned protocol rather than to platform internals.
pluginUntilBuild = 262.*

platformVersion = 2025.3
lsp4ijVersion = 0.21.0

# Gradle itself must run on JDK 17-21; a newer JDK reports only its version
# number as the failure. The Kotlin toolchain below is pinned separately.
# The wrapper is Gradle 9.x because IntelliJ Platform Gradle Plugin 2.13+
# requires it.
org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
